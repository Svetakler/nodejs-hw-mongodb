tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update contact details by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: The ID of the contact to update
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Jane Doe'
          phoneNumber:
            type: string
            example: '+987654321'
          email:
            type: string
            format: email
            example: 'jane.doe@example.com'
          isFavourite:
            type: boolean
            example: false
responses:
  '200':
    description: Successfully updated the contact
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
