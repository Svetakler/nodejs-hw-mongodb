tags:
  - Contacts
summary: Get all user contacts
description: Returns a list of contacts with optional pagination and filtering
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: Page number for pagination
  - in: query
    name: limit
    schema:
      type: integer
      example: 10
    description: Number of contacts per page
  - in: query
    name: type
    schema:
      type: string
      example: personal
    description: Filter contacts by type (e.g., personal, work)
responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contacts.yaml
                page:
                  type: integer
                  example: 2
                perPage:
                  type: integer
                  example: 1
                totalItems:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 10
                hasPreviousPage:
                  type: boolean
                  example: true
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
