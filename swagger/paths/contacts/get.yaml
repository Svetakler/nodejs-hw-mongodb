tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of contacts with optional filters
security:
  - bearerAuth: []
parameters:
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by favourite status
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by type
responses:
  '200':
    description: Successfully retrieved list of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
