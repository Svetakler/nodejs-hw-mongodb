tags:
  - Contacts
summary: Get all user contacts
description: Returns a list of contacts with optional pagination and filtering
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
    description: Number of contacts per page
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: 'home'
    description: Filter contacts by type
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
    description: Field to sort by, default is _id
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
    description: Sort order (ascending or descending)
responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contacts.yaml
                page:
                  type: integer
                  example: 2
                perPage:
                  type: integer
                  example: 1
                totalItems:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 10
                hasPreviousPage:
                  type: boolean
                  example: true
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
